<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson - CodeLearn</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <div class="logo">&lt;/&gt; CodeLearn</div>
      <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#lessons">Lessons</a>
        <a href="index.html#practice">Practice</a>
        <a href="index.html#quiz">Quiz</a>
        <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
      </nav>
    </div>
  </header>

  <main class="lesson-page">
    <div class="container">
      <a href="index.html#lessons" class="back-link">← Back to Lessons</a>
      <div id="lesson-content" class="lesson-content">
        <p>Loading lesson...</p>
      </div>
      <div class="lesson-nav">
        <button id="prev-lesson" class="btn-small">← Previous</button>
        <button id="mark-complete" class="btn-small">✓ Mark as Complete</button>
        <button id="next-lesson" class="btn-small">Next →</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CodeLearn. Built with ❤️ for learners.</p>
    </div>
  </footer>

  <script src="js/lessons.js"></script>

</html>
